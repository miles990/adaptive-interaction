[package]
name = "interaction-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first HTTP API (axum) + SSE event stream for the interaction runtime"

[dependencies]
interaction-core = { workspace = true }
interaction-runtime = { workspace = true }
interaction-recipe = { workspace = true }
interaction-registry = { workspace = true }
interaction-policy = { workspace = true }
interaction-tool-schema = { workspace = true }
# Character Presentation Protocol 型別（hello／receipt／event／manifest DTO）。
interaction-character = { path = "../interaction-character" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 測試用的程序內假感測來源（實作 runtime 的 SensorSource port）。
async-trait = { workspace = true }
reqwest = { workspace = true }
# WebSocket fixture client for the /v1/character/ws acceptance tests.
tokio-tungstenite = "0.24"
