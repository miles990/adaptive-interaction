[package]
name = "interaction-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Adaptive interaction runtime: orchestrator, executor, sessions, scheduler, lifecycle"

[features]
default = ["mic-capture"]
# Real microphone capture backend (cpal). Off = honest unavailable receptor.
mic-capture = ["adapters-media/mic-capture"]

[dependencies]
interaction-core = { workspace = true }
interaction-registry = { workspace = true }
interaction-adapter-declarative = { path = "../interaction-adapter-declarative" }
# Character Presentation Protocol（CPP v1.0）權威實作：manifest／協商／gateway 純狀態機。
interaction-character = { path = "../interaction-character" }
# 小樞 Reference Character Pack：entrypoint id 與 character-rig 2.0 遷移（不在協定核心）。
interaction-character-shu = { path = "../interaction-character-shu" }
adapters-media = { path = "../../adapters/media", default-features = false }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "pnm"] }
interaction-policy = { workspace = true }
interaction-recipe = { workspace = true }
interaction-events = { workspace = true }
interaction-storage = { workspace = true }
interaction-adapter-sdk = { workspace = true }
adapters-builtin = { workspace = true }
interaction-agent-gateway = { path = "../interaction-agent-gateway" }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
# v0.5 Phase 6: iPhone Mobile Provider（TLS WebSocket＋Bonjour＋配對）。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.13"
mdns-sd = "0.11"
hmac = "0.12"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
futures-util = "0.3"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.24" }
libc = "0.2"
axum = "0.8"
tempfile = { workspace = true }

[dependencies.interaction-tool-schema]
workspace = true
