[package]
name = "interaction-desktop"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Tauri 2 control center for the adaptive interaction runtime"

[lib]
name = "interaction_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
interaction-core = { path = "../../../crates/interaction-core" }
interaction-runtime = { path = "../../../crates/interaction-runtime" }
interaction-recipe = { path = "../../../crates/interaction-recipe" }
interaction-registry = { path = "../../../crates/interaction-registry" }
interaction-policy = { path = "../../../crates/interaction-policy" }
interaction-api = { path = "../../../crates/interaction-api" }
interaction-tool-schema = { path = "../../../crates/interaction-tool-schema" }
# Character Presentation Protocol：匯入角色時的 manifest／資產驗證（host 端不重寫規則）。
interaction-character = { path = "../../../crates/interaction-character" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Native folder picker for the work page. The dialog crate pulls
# `tauri-plugin-fs` in as a Rust dependency, but we deliberately never call
# `tauri_plugin_fs::init()` and grant no `fs:*` permission, so no filesystem
# command is exposed to the WebView — it receives a path string and nothing
# else. `dialog:allow-open` is granted to the `main` window alone
# (capabilities/main-dialog.json).
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
